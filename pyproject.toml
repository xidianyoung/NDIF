[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ndif"
version = "1.0.0"
description = "Neural Dynamics Identifiability Framework: which dynamical claims a neural recording, its preprocessing and an estimator can support."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
    "identifiability", "dynamical-systems", "quasipotential", "energy-landscape",
    "neural-population-activity", "stochastic-differential-equations",
    "minimum-action", "freidlin-wentzell",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
# the non-neural series of examples/example_03_cross_domain.py
examples = ["statsmodels>=0.13"]

[project.scripts]
ndif-certify = "ndif.cli:main"

[tool.setuptools]
packages = ["ndif"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning"]
